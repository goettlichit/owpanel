# Checks the server scripts with ShellCheck and bats. The tests need no root
# and no Debian system, so a standard Ubuntu runner is enough.
name: Server scripts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Pinned to a commit, because tags can be moved.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bats shellcheck

      - name: Show tool versions
        run: |
          shellcheck --version
          bats --version

      - name: Check server scripts
        run: tests/check.sh

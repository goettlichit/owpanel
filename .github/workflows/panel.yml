# Checks the Laravel panel: code style, tests, known vulnerabilities and the
# licences of all dependencies. Runs on PHP 8.5 like the servers (E-042).
name: Panel

on:
  push:
    branches: [main]
    paths:
      - 'panel/**'
      - '.github/workflows/panel.yml'
  pull_request:
    paths:
      - 'panel/**'
      - '.github/workflows/panel.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: panel

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions are pinned to a commit, because tags can be moved (E-040).
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite, intl
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install PHP dependencies
        run: |
          composer validate --strict
          composer install --no-interaction --no-progress --prefer-dist

      - name: Install and build frontend assets
        run: |
          npm ci
          npm run build

      - name: Check licences
        run: node scripts/check-licenses.mjs

      - name: Check for known vulnerabilities
        run: |
          composer audit
          npm audit --audit-level=moderate

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run tests
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

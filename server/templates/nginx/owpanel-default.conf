# Managed by OWPanel. Do not edit, changes are overwritten.
# Closes requests for unknown hostnames, including TLS and QUIC handshakes,
# without handing out a certificate of another site. Only this server sets
# reuseport for QUIC, because nginx allows it once per address and port.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    listen 443 quic reuseport default_server;
    listen [::]:443 quic reuseport default_server;

    http2 on;
    http3 on;
    server_name _;
    ssl_reject_handshake on;
}

# Managed by OWPanel. Do not edit, changes are overwritten.
# Site @USER@ (@DOMAIN@), PHP, HTTP only.
server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;

    root @ROOT@/htdocs/public;
    # Request size and PHP run time follow the settings of the website (E-173).
    client_max_body_size @BODY@m;

    # Without index.php or index.html the start page shows the placeholder (E-171).
    index index.php index.html /.owpanel-welcome.html;

    access_log /var/log/nginx/@USER@.access.log;
    error_log /var/log/nginx/@USER@.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/owpanel/acme;
        default_type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /.owpanel-welcome.html {
        internal;
        # Only the start page; other folders without an index stay at 403.
        if ($request_uri !~ "^/(\?|$)") {
            return 403;
        }
        add_header Cache-Control "no-cache" always;
        alias /var/lib/owpanel/welcome/@USER@.html;
    }

    location ~ \.php$ {
        include /etc/nginx/owpanel/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/owpanel-@USER@.sock;
        fastcgi_read_timeout @TIMEOUT@s;
    }

    location ~ /\.(?!well-known/) {
        # Requests for hidden files such as .env or .git also go to one shared
        # log, which fail2ban watches (E-174).
        error_log /var/log/nginx/@USER@.error.log;
        error_log /var/log/nginx/owpanel-hidden.log;
        deny all;
    }

    # Browsers may keep static files (E-176). The locations come after the
    # one for hidden files, so .git and the like stay closed. Missing files
    # still go to index.php, as in "location /".
    location ~* \.(?:css|js|mjs)$ {
        expires 7d;
        try_files $uri /index.php?$query_string;
    }

    location ~* \.(?:avif|webp|png|jpe?g|gif|ico|svg|woff2?|ttf|otf|eot|mp4|webm|mp3|ogg|pdf)$ {
        expires 30d;
        try_files $uri /index.php?$query_string;
    }
}

# www.@DOMAIN@ over HTTPS and HTTP/3 with the site's certificate, sent on to
# the main address (E-110).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;

    http2 on;
    http3 on;
    server_name www.@DOMAIN@;

    ssl_certificate /etc/letsencrypt/live/@USER@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@USER@/privkey.pem;

    include /etc/nginx/owpanel/headers.conf;

    location / {
        include /etc/nginx/owpanel/headers.conf;
        return 301 https://@DOMAIN@$request_uri;
    }
}

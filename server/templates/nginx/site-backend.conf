# Managed by OWPanel. Do not edit, changes are overwritten.
# Backend of site @USER@, PHP (E-195). Only the gateway reaches
# it, over TLS with the pinned certificate of this server (E-186); TLS,
# HTTP/3, the certificate and the suspension page live at the gateway.
server {
    listen @LISTEN@:8443 ssl;
    server_name @NAMES@;
    include /etc/nginx/owpanel/backend-tls.conf;

    # The visitor's address and scheme come from the gateway.
    set_real_ip_from @GATEWAY@;
    real_ip_header X-Forwarded-For;
    # Redirects of nginx itself keep the visitor's scheme and port.
    absolute_redirect off;

    include /etc/nginx/owpanel/backend-headers.conf;
    include /etc/nginx/owpanel-site-rules/@USER@-headers.conf;

    root @ROOT@/htdocs/public;
    client_max_body_size @BODY@m;
    index index.php index.html /.owpanel-welcome.html;
    include /etc/nginx/owpanel-site-rules/@USER@-paths.conf;

    # The gateway keeps the access log; PHP messages land here.
    access_log off;
    error_log /var/log/nginx/@USER@.error.log;

    location / {
        include /etc/nginx/owpanel/backend-headers.conf;
        include /etc/nginx/owpanel-site-rules/@USER@-headers.conf;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Placeholder page of a new website, only for the start page (E-171).
    location = /.owpanel-welcome.html {
        internal;
        if ($request_uri !~ "^/(\?|$)") {
            return 403;
        }
        include /etc/nginx/owpanel/backend-headers.conf;
        include /etc/nginx/owpanel-site-rules/@USER@-headers.conf;
        add_header Cache-Control "no-cache" always;
        alias /var/lib/owpanel/welcome/@USER@.html;
    }

    location ~ \.php$ {
        include /etc/nginx/owpanel/backend-headers.conf;
        include /etc/nginx/owpanel-site-rules/@USER@-headers.conf;
        include /etc/nginx/owpanel/fastcgi-backend.conf;
        fastcgi_pass unix:/run/php/owpanel-@USER@.sock;
        fastcgi_read_timeout @TIMEOUT@s;
    }

    # The gateway refuses hidden files already; this stays as second line.
    location ~ /\.(?!well-known/) {
        include /etc/nginx/owpanel/backend-headers.conf;
        include /etc/nginx/owpanel-site-rules/@USER@-headers.conf;
        deny all;
    }

    # Browser cache for static files (E-176); missing ones go to index.php.
    location ~* \.(?:css|js|mjs)$ {
        include /etc/nginx/owpanel/backend-headers.conf;
        include /etc/nginx/owpanel-site-rules/@USER@-headers.conf;
        expires 7d;
        try_files $uri /index.php?$query_string;
    }

    location ~* \.(?:avif|webp|png|jpe?g|gif|ico|svg|woff2?|ttf|otf|eot|mp4|webm|mp3|ogg|pdf)$ {
        include /etc/nginx/owpanel/backend-headers.conf;
        include /etc/nginx/owpanel-site-rules/@USER@-headers.conf;
        expires 30d;
        try_files $uri /index.php?$query_string;
    }
}

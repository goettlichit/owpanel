# Managed by OWPanel. Do not edit, changes are overwritten.
# Included in every server and location block of a site with a certificate,
# because nginx drops inherited add_header lines as soon as a block sets its
# own (E-045). HSTS is left out on purpose; administrators add it per site
# under Webserver (E-184).
add_header Alt-Svc 'h3=":443"; ma=86400' always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;

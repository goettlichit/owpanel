# Managed by OWPanel. Do not edit, changes are overwritten.
# PHP handling for the backend of a website (E-195), as fastcgi-php.conf but
# with the scheme, HTTPS and port of the gateway.
fastcgi_split_path_info ^(.+?\.php)(/.*)$;
try_files $fastcgi_script_name =404;

set $path_info $fastcgi_path_info;
fastcgi_param PATH_INFO $path_info;
fastcgi_index index.php;

include /etc/nginx/owpanel/fastcgi-backend-params.conf;
fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

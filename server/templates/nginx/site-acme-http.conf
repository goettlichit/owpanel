# Managed by OWPanel. Do not edit, changes are overwritten.
# Site @USER@ moves to @NAMES@ (E-112). Only while its certificate is being
# requested: Let's Encrypt reaches the new names, the site itself still
# answers at its old domain until the certificate is there.
server {
    listen 80;
    listen [::]:80;
    server_name @NAMES@;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/owpanel/acme;
        default_type text/plain;
    }

    location / {
        return 404;
    }
}

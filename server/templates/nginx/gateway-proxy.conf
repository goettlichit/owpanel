# Managed by OWPanel. Do not edit, changes are overwritten.
# How the gateway passes a request to a backend (E-195, E-186). The backend
# trusts these headers only from the gateway (set_real_ip_from).
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Real-IP $remote_addr;
proxy_connect_timeout 10s;
# Only the pinned certificate of the backend's server counts (E-186).
proxy_ssl_verify on;
proxy_ssl_verify_depth 1;
proxy_ssl_name owpanel-backend;
proxy_ssl_server_name on;
proxy_ssl_session_reuse on;
proxy_ssl_protocols TLSv1.3;

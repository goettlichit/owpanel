# Managed by OWPanel. Do not edit, changes are overwritten.
# Compresses text responses of the panel and of every website (E-176).
# nginx always compresses text/html once gzip is on. Images, fonts in
# woff/woff2 and archives are compressed already and stay out.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/css
    text/plain
    text/xml
    text/javascript
    application/javascript
    application/json
    application/ld+json
    application/manifest+json
    application/xml
    application/rss+xml
    application/atom+xml
    application/wasm
    image/svg+xml
    image/x-icon
    font/ttf
    font/otf
    application/vnd.ms-fontobject;

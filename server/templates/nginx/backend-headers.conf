# Managed by OWPanel. Do not edit, changes are overwritten.
# Security headers of a website's backend (E-195), as headers.conf without
# Alt-Svc, which the gateway sets. Included in every server and location
# block, because nginx drops inherited add_header lines as soon as a block
# sets its own (E-045). HSTS is left out on purpose; administrators add it
# per site under Webserver (E-184).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;

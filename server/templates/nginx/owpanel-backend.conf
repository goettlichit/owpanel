# Managed by OWPanel. Do not edit, changes are overwritten.
# Backend part of the websites on this server (E-195). PHP sees the scheme
# and port the visitor used at the gateway, not those of the backend.
map $http_x_forwarded_proto $owpanel_scheme {
    https https;
    default http;
}

map $http_x_forwarded_proto $owpanel_https {
    https on;
    default "";
}

map $http_x_forwarded_proto $owpanel_port {
    https 443;
    default 80;
}

include /etc/nginx/owpanel-backend/*.conf;

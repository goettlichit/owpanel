# www.@DOMAIN@ on port 80: Let's Encrypt can check it, everything else goes
# to the main address of the site (E-110).
server {
    listen 80;
    listen [::]:80;
    server_name www.@DOMAIN@;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/owpanel/acme;
        default_type text/plain;
    }

    location / {
        return 301 @SCHEME@://@DOMAIN@$request_uri;
    }
}

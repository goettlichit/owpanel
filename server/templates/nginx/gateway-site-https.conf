# Managed by OWPanel. Do not edit, changes are overwritten.
# Gateway of site @USER@ (@DOMAIN@) with a Let's Encrypt certificate (E-195):
# HTTPS and HTTP/3, HTTP/2 and HTTP/1.1 over TCP stay as fallback (E-025).
# Passes the visitors to the backend of the website's server.
server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/owpanel/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://@DOMAIN@$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;
    http3 on;
    server_name @DOMAIN@;

    ssl_certificate /etc/letsencrypt/live/@USER@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@USER@/privkey.pem;
    # Only Alt-Svc here; the backend sets the other headers, also the own
    # ones of the website (E-184), and they pass through unchanged.
    include /etc/nginx/owpanel/gateway-headers.conf;

    client_max_body_size @BODY@m;
    access_log /var/log/nginx/@USER@.access.log;
    error_log /var/log/nginx/@USER@.gateway-error.log;

    # Hidden files never reach the backend; refusals go to the shared log
    # for fail2ban, which bans on this server (E-174).
    location ~ /\.(?!well-known/) {
        error_log /var/log/nginx/@USER@.gateway-error.log;
        error_log /var/log/nginx/owpanel-hidden.log;
        deny all;
    }

    location / {
        include /etc/nginx/owpanel/gateway-proxy.conf;
        proxy_pass https://owpanel_backend_@BACKEND@;
        proxy_ssl_trusted_certificate /etc/owpanel/backends/@BACKEND@.crt;
        proxy_read_timeout @TIMEOUT@s;
        proxy_send_timeout @TIMEOUT@s;
    }
}

# Managed by OWPanel. Do not edit, changes are overwritten.
# Included after server_name by site-suspend (E-127): every request gets a
# neutral page with HTTP 503, only Let's Encrypt still reaches its path, so
# certificates keep renewing. site-unsuspend removes the include again.
error_page 503 /owpanel-suspended.html;

if ($uri !~ "^/(\.well-known/acme-challenge/|owpanel-suspended\.html$)") {
    return 503;
}

location = /owpanel-suspended.html {
    internal;
    root /var/lib/owpanel/suspended-page;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "3600" always;
}

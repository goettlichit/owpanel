# Managed by OWPanel. Do not edit, changes are overwritten.
# SFTP access of the websites (E-089). Members of owpanel-sftp only get SFTP,
# locked into their website directory. Shell, forwarding and tunnels are off.
# A Match block in an included file ends with the file, so the rest of
# sshd_config is not affected.
Match Group owpanel-sftp
    ChrootDirectory /var/www/%u
    ForceCommand internal-sftp -d /htdocs -u 0027
    AuthorizedKeysFile /etc/ssh/owpanel-sftp/%u
    AuthenticationMethods publickey password
    PubkeyAuthentication yes
    PasswordAuthentication yes
    KbdInteractiveAuthentication no
    AllowAgentForwarding no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    PermitTunnel no
    PermitTTY no
    PermitUserRC no
    X11Forwarding no

; Managed by OWPanel. Do not edit, changes are overwritten.
; The panel's web requests (E-041). The queue worker runs separately as
; owpanel-worker and is the only one that can read the SSH key (E-070).
[ow10000]
user = ow10000
group = ow10000
listen = /run/php/owpanel-ow10000.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660

pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 30s
pm.max_requests = 500

chdir = /
security.limit_extensions = .php

php_admin_value[open_basedir] = /var/www/ow10000/
php_admin_value[upload_tmp_dir] = /var/www/ow10000/tmp
php_admin_value[sys_temp_dir] = /var/www/ow10000/tmp
; Uploads of database dumps (E-082); matches transfers.max_upload_mb.
php_admin_value[upload_max_filesize] = 256M
php_admin_value[post_max_size] = 260M
php_admin_value[max_input_time] = 600
php_admin_value[expose_php] = Off
php_admin_value[display_errors] = Off
php_admin_value[log_errors] = On
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec

# Managed by OWPanel. Do not edit, changes are overwritten.
# The panel itself (ow10000, @DOMAIN@): HTTPS and HTTP/3 with a Let's Encrypt
# certificate, HTTP/2 and HTTP/1.1 over TCP as fallback (E-025, E-041).
# Kept apart from the website configurations in /etc/nginx/owpanel-sites.
server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;

    access_log /var/log/nginx/ow10000.access.log;
    error_log /var/log/nginx/ow10000.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/owpanel/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://@DOMAIN@$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;

    http2 on;
    http3 on;
    server_name @DOMAIN@;

    ssl_certificate /etc/letsencrypt/live/ow10000/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ow10000/privkey.pem;

    include /etc/nginx/owpanel/headers.conf;

    # "current" points to the active release (E-068).
    root /var/www/ow10000/current/panel/public;
    index index.php;

    access_log /var/log/nginx/ow10000.access.log;
    error_log /var/log/nginx/ow10000.error.log;

    # Database dumps up to 256 MB (E-082).
    client_max_body_size 260m;
    client_body_timeout 600s;

    location / {
        include /etc/nginx/owpanel/headers.conf;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Built assets carry a hash in their name and never change.
    location /build/ {
        include /etc/nginx/owpanel/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.php {
        include /etc/nginx/owpanel/headers.conf;
        include /etc/nginx/owpanel/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/owpanel-ow10000.sock;
    }

    # Only index.php runs; no other PHP file is reachable.
    location ~ \.php$ {
        include /etc/nginx/owpanel/headers.conf;
        return 404;
    }

    location ~ /\.(?!well-known/) {
        include /etc/nginx/owpanel/headers.conf;
        # Requests for hidden files such as .env or .git also go to one shared
        # log, which fail2ban watches (E-174).
        error_log /var/log/nginx/ow10000.error.log;
        error_log /var/log/nginx/owpanel-hidden.log;
        deny all;
    }
}

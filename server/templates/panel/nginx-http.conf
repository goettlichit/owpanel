# Managed by OWPanel. Do not edit, changes are overwritten.
# The panel itself (ow10000, @DOMAIN@), HTTP only until the certificate
# exists. Serves only the Let's Encrypt challenge (E-069).
server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;

    access_log /var/log/nginx/ow10000.access.log;
    error_log /var/log/nginx/ow10000.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/owpanel/acme;
        default_type text/plain;
    }

    location / {
        return 404;
    }
}

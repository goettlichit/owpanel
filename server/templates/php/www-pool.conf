; Managed by OWPanel. Do not edit, changes are overwritten.
; Replaces the package's default pool. PHP-FPM needs at least one pool, but
; no site uses this one. It runs as nobody and only root can reach its socket.
; One socket per PHP version: two versions on the same socket keep the second
; PHP-FPM from starting (2026-11-23).
[www]
user = nobody
group = nogroup
listen = /run/php/owpanel-idle-@VERSION@.sock
listen.owner = root
listen.group = root
listen.mode = 0600
pm = ondemand
pm.max_children = 1
pm.process_idle_timeout = 10s

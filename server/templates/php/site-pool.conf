; Managed by OWPanel. Do not edit, changes are overwritten.
[@USER@]
user = @USER@
group = @USER@
listen = /run/php/owpanel-@USER@.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660

pm = ondemand
pm.max_children = @PROCESSES@
pm.process_idle_timeout = 30s
pm.max_requests = 500

chdir = /
security.limit_extensions = .php

php_admin_value[open_basedir] = @ROOT@/htdocs/:@ROOT@/tmp/
php_admin_value[upload_tmp_dir] = @ROOT@/tmp
php_admin_value[session.save_path] = @ROOT@/tmp
php_admin_value[sys_temp_dir] = @ROOT@/tmp

; Settings of the website (E-173). php_admin_value cannot be raised by
; .user.ini or ini_set; display_errors stays a default the code may change.
request_terminate_timeout = @TERMINATE@s
php_admin_value[memory_limit] = @MEMORY@M
php_admin_value[upload_max_filesize] = @UPLOAD@M
php_admin_value[post_max_size] = @POST@M
php_admin_value[max_execution_time] = @TIME@
php_admin_value[max_input_time] = @TIME@
php_flag[display_errors] = @ERRORS@

; Safer session cookies (E-176). php_value, so an application that needs
; other values can set them with ini_set, session_set_cookie_params or
; .user.ini. cookie_secure is on while a certificate covers the domain.
php_flag[session.cookie_httponly] = on
php_flag[session.use_strict_mode] = on
php_value[session.cookie_samesite] = Lax
php_flag[session.cookie_secure] = @SECURE@
